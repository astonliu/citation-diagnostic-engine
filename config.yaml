# Citation Repair Engine — configuration
#
# NOTE: nothing in `cde/` reads this file. Model identity, pins and judge
# governance are enforced in code: the generator model is passed to
# `cde.runtime.production_launcher.launch` and checked against its
# `authorized_models` allowlist, and the judge is pinned in
# `cde/runtime/openai_transport.py`. This file is a human-readable summary of
# that arrangement; changing a value here changes nothing at runtime.

# Two models, two families. The generator extracts claims on the Anthropic
# path; the judge scores coverage on the OpenAI path. A run whose judge is the
# same family as its generator is refused by the launcher unless a dated
# preregistration amendment or a recorded scope ruling permits it.
# Semantic labels and ground truth are assigned by human adjudication, never by
# a model.
models:
  generator:
    family: anthropic
    pin: "claude-haiku-4-5"   # the model actually passed to the launcher
  judge:
    family: openai
    pin: "gpt-5.6-sol"        # openai_transport.JUDGE_MODEL_ID

# Stage 4 diagnosis mapper is rule-based (not an LLM) — see doc/taxonomy.md.
# Repair drafting is not enabled in this build; F5 ships escalation-only.
repair_drafting_model: ""

ncbi_api_key: ""        # populate from .env, never commit the key directly
anthropic_api_key: ""   # populate from .env, never commit the key directly (generator)
openai_api_key: ""      # populate from .env, never commit the key directly (judge)
